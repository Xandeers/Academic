version : '3.8'

services:
  database:
    build: DataBase/
    container_name: db_postgres

    ports:
      - "8001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - mon_network
    
  

  api:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - mon_network

networks:
  mon_network:
    driver: bridge

volumes:
  postgres_data:
